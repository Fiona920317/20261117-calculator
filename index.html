<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/成績計算機.css" />
    <title>1111-hw-成績計算機</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="showing-area container">
        <div class="screen" type="text">123</div>
      </div>
      <div class="typing-area container">
        <div class="numbers">
          <div>
            <button class="btn number-btn" id="7">7</button>
            <button class="btn number-btn" id="8">8</button>
            <button class="btn number-btn" id="9">9</button>
          </div>
          <div>
            <button class="btn number-btn" id="4">4</button>
            <button class="btn number-btn" id="5">5</button>
            <button class="btn number-btn" id="6">6</button>
          </div>
          <div>
            <button class="btn number-btn" id="1">1</button>
            <button class="btn number-btn" id="2">2</button>
            <button class="btn number-btn" id="3">3</button>
          </div>
          <div class="last-line">
            <button class="btn operator-btn" id="C">C</button>
            <button class="btn number-btn" id="0">0</button>
            <button class="btn operator-btn" id="%">%</button>
          </div>
        </div>
        <div class="operators">
          <button class="btn operator-btn" id="+">+</button>
          <button class="btn operator-btn" id="-">-</button>
          <button class="btn operator-btn" id="*">*</button>
          <button class="btn operator-btn" id="/">/</button>
        </div>
        <div class="functions">
          <button class="btn operator-btn" id="=">=</button>
        </div>
      </div>
    </div>
    <script src="./js/成績計算機.js"></script>
  </body>
</html>
