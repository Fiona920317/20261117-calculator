<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/成績計算機.css" />
    <title>1111-hw-成績計算機</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="showing-area container">
        <div class="screen" type="text"></div>
      </div>
      <div class="typing-area container">
        <div class="numbers">
          <div>
            <div class="btn number-btn">7</div>
            <div class="btn number-btn">8</div>
            <div class="btn number-btn">9</div>
          </div>
          <div>
            <div class="btn number-btn">4</div>
            <div class="btn number-btn">5</div>
            <div class="btn number-btn">6</div>
          </div>
          <div>
            <div class="btn number-btn">1</div>
            <div class="btn number-btn">2</div>
            <div class="btn number-btn">3</div>
          </div>
          <div class="last-line">
            <div class="btn operator-btn">C</div>
            <div class="btn number-btn">0</div>
            <div class="btn operator-btn">%</div>
          </div>
        </div>
        <div class="operators">
          <div class="btn operator-btn">+</div>
          <div class="btn operator-btn">-</div>
          <div class="btn operator-btn">*</div>
          <div class="btn operator-btn">/</div>
        </div>
        <div class="functions">
          <div class="btn operator-btn">=</div>
        </div>
      </div>
    </div>
    <script src="./js/成績計算機.js"></script>
  </body>
</html>
